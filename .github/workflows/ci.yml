name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AggregatorService.csproj

      - name: Build
        run: dotnet build AggregatorService.csproj -c Release --no-restore

      - uses: docker/setup-buildx-action@v3

      - name: Docker build
        run: docker build -t aggregator-service:ci .
